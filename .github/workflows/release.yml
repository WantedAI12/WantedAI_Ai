name: dev-deployment-gates

on:
  workflow_dispatch:
    inputs:
      publish_attestation:
        description: 'Publish the verified wheel provenance (authorized release operator only)'
        required: false
        default: false
        type: boolean
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dev-deployment-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: perfumery_test
          POSTGRES_PASSWORD: isolated-ci-fixture-only
          POSTGRES_DB: perfumery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perfumery_test -d perfumery_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PERFUMERY_AI_LOCAL_PROFILE: "disabled"
      PERFUMERY_AI_TEST_POSTGRES_URL: postgresql://perfumery_test:isolated-ci-fixture-only@127.0.0.1:5432/perfumery_test
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deployment and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[commercial,test]" \
            modal==1.5.5 build==1.3.0 ruff==0.15.15 \
            numpy==2.2.6 fastapi==0.116.1 cryptography==46.0.3 \
            httpx==0.28.1 PyJWT==2.10.1 pytest==8.4.2 rdkit==2025.9.4 scipy==1.15.2 \
            starlette==0.47.3 anyio==4.10.0
      - name: Install CPU-only neural export test dependency
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify tracked LFS artifacts
        run: |
          git lfs ls-files
          test -s benchmarks/industrial_ingredient_registry_v1.db
          test -s dist/automatic-safe-activation-v1/perfumery_ai_core-1.4.0-py3-none-any.whl
          test -s dist/full-registry-activation-v2/perfumery_ai_core-1.4.0-py3-none-any.whl
      - name: Static checks
        run: |
          python -m ruff check --select E4,E7,E9,F fragrance_ai/api.py fragrance_ai/api_cli.py \
            fragrance_ai/platform fragrance_ai/recommender deploy \
            fragrance_ai/research/atlas_profiles.py fragrance_ai/research/atlas_inference.py \
            fragrance_ai/research/structured_kernel.py \
            fragrance_ai/research/scientific_kernel.py \
            fragrance_ai/research/formulation_network.py \
            scripts/bind_shared_reference_v69.py scripts/expand_formulation_process_v69.py \
            scripts/prepare_emulsion_v69.py scripts/prepare_formulation_v69.py \
            scripts/train_formulation_v69.py scripts/verify_formulation_v69.py \
            scripts/verify_shared_products_v69.py scripts/serve_product_runtime_v42.py \
            tests/test_formulation_core_v69.py \
            tests/test_runtime_release_v69.py scripts/verify_modal_v69.py \
            scripts/train_main_backbone_v68.py scripts/verify_scientific_backbone_v68.py \
            tests/test_scientific_backbone_v68.py tests/test_exposure_transport_v68.py \
            scripts/train_main_backbone_v66.py scripts/verify_main_backbone_v66.py \
            scripts/verify_spec_contract_v67.py scripts/verify_physical_exposure_v65.py \
            scripts/verify_search_recovery_v64.py scripts/benchmark_search_recovery_v64.py \
            tests/test_main_backbone_v66.py tests/test_physical_exposure_v65.py \
            tests/test_search_recovery_v64.py tests/test_spec_contract_v67.py \
            scripts/build_industrial_ingredient_registry_v1.py \
            scripts/audit_data.py tests/test_core_smoke.py \
            tests/test_recommender.py tests/test_olfactory_upgrade.py \
            tests/test_industrial_catalog.py tests/test_promotion_activation.py \
            tests/test_registry_activation.py \
            tests/test_odor_integrity.py tests/test_runtime_policy.py \
            scripts/build_odor_integrity_catalog.py scripts/audit_odor_integrity.py \
            tests/test_inference_efficiency.py \
            tests/test_recipe_quality.py \
            tests/test_phase_runtime.py \
            fragrance_ai/research/perception_validation.py \
            scripts/benchmark_human_mixture_profiles.py tests/test_human_mixture_profiles.py \
            fragrance_ai/research/conditional_profiles.py \
            scripts/train_conditional_profiles_v2.py tests/test_conditional_profiles_v2.py \
            scripts/evaluate_recipe_perception_guidance.py tests/test_perception_guidance.py \
            scripts/evaluate_full_profile_scoring.py tests/test_full_profile_match.py \
            scripts/evaluate_request_space.py tests/test_full_pool_search.py \
            tests/test_adaptive_pyramid.py \
            tests/test_dose_refinement.py \
            scripts/summarize_request_refinement.py tests/test_request_refinement_summary.py \
            tests/test_modal_deployment.py tests/test_modal_auth_contract.py \
            tests/test_evidence_trust.py tests/test_release_security.py \
            tests/test_validation_pipeline.py \
            tests/test_manufacturing_readiness.py tests/test_platform_api.py tests/test_rd_contract.py \
            tests/test_platform_workspace.py tests/test_api_security.py \
            tests/test_api_oidc_tenant.py tests/test_postgres_contract.py \
            tests/test_fractional_bound_v70.py tests/test_public_registry_index_v70.py \
            tests/test_lotion_regulatory_v70.py \
            tests/test_global_search_v71.py tests/test_prior_sampling_v71.py \
            tests/test_whole_pool_search_v72.py tests/test_component_observations_v72.py \
            tests/test_model_comparison_v72.py scripts/benchmark_candidate_v72.py \
            scripts/summarize_model_comparison_v72.py \
            fragrance_ai/research/autoregressive_network.py \
            scripts/train_autoregressive_v73.py scripts/verify_autoregressive_v73.py \
            tests/test_autoregressive_refinement_v73.py tests/test_autoregressive_neural_v73.py \
            fragrance_ai/research/constrained_autoregressive_network.py fragrance_ai/research/aligned_autoregressive_network.py \
            scripts/train_constrained_autoregressive_v74.py tests/test_aligned_autoregressive_v75.py
          python -m ruff check --select E4,E7,E9,F \
            fragrance_ai/recommender/odor_resolution.py \
            scripts/resolve_odor_space_v78.py scripts/acquire_odor_sources_v78.py \
            scripts/prepare_external_odor_evidence_v78.py tests/test_odor_resolution_v78.py \
            scripts/recover_odor_support_v79.py scripts/verify_odor_support_v79.py tests/test_odor_support_v79.py \
            scripts/prepare_supported_release_v80.py scripts/verify_supported_local_v80.py \
            tests/test_supported_release_v80.py tests/test_runtime_release_v80.py
          python -m compileall -q fragrance_ai deploy scripts tests
          python scripts/verify_publication_v91.py
          node --check fragrance_ai/ui/app.js
      - name: Deployment-focused regression
        run: >-
          python -m pytest -W error -vv --durations=15 --junitxml=artifacts/regression.xml
          tests/test_core_smoke.py
          tests/test_rd_contract.py
          tests/test_recommender.py
          tests/test_olfactory_upgrade.py
          tests/test_industrial_catalog.py
          tests/test_promotion_activation.py
          tests/test_registry_activation.py
          tests/test_odor_integrity.py
          tests/test_physical_evidence_v56.py
          tests/test_runtime_policy.py
          tests/test_inference_efficiency.py
          tests/test_recipe_quality.py
          tests/test_phase_runtime.py
          tests/test_human_mixture_profiles.py
          tests/test_conditional_profiles_v2.py
          tests/test_perception_guidance.py
          tests/test_full_profile_match.py
          tests/test_full_pool_search.py
          tests/test_adaptive_pyramid.py
          tests/test_dose_refinement.py
          tests/test_request_refinement_summary.py
          tests/test_modal_deployment.py
          tests/test_audit_reporting_api.py
          tests/test_formula_stream.py
          tests/test_modal_auth_contract.py
          tests/test_evidence_trust.py
          tests/test_release_security.py
          tests/test_validation_pipeline.py
          tests/test_manufacturing_readiness.py
          tests/test_platform_api.py
          tests/test_platform_workspace.py
          tests/test_api_security.py
          tests/test_api_oidc_tenant.py
          tests/test_postgres_contract.py
          tests/test_postgres_integration.py
          tests/test_runtime_release_v62.py
          tests/test_runtime_release_v63.py
          tests/test_lotion_solver_v27.py
          tests/test_lotion_balance_v43.py
          tests/test_lotion_reference_objective_v59.py
          tests/test_search_recovery_v64.py
          tests/test_physical_exposure_v65.py
          tests/test_main_backbone_v66.py
          tests/test_scientific_backbone_v68.py
          tests/test_exposure_transport_v68.py
          tests/test_formulation_core_v69.py
          tests/test_runtime_release_v69.py
          tests/test_unified_product_v60.py
          tests/test_spec_contract_v67.py
          tests/test_fractional_profile_cuts_v70.py
          tests/test_guidance_gradient_v70.py
          tests/test_literal_fast_path_v70.py
          tests/test_public_evidence_v70.py
          tests/test_junit_floor_v70.py
          tests/test_framework_projection_v70.py
          tests/test_fine_identity_cache_v70.py
          tests/test_fractional_bound_v70.py
          tests/test_public_registry_index_v70.py
          tests/test_lotion_regulatory_v70.py
          tests/test_runtime_release_v70.py
          tests/test_global_search_v71.py
          tests/test_prior_sampling_v71.py
          tests/test_whole_pool_search_v72.py
          tests/test_component_observations_v72.py
          tests/test_model_comparison_v72.py
          tests/test_autoregressive_refinement_v73.py
          tests/test_autoregressive_neural_v73.py
          tests/test_aligned_autoregressive_v75.py
          tests/test_system_physics_v76.py
          tests/test_nonlinear_inverse_v76.py
          tests/test_mass_projection_v76.py
          tests/test_numerical_feasibility_v76.py
          tests/test_process_graph_v76.py
          tests/test_shared_observed_v76.py
          tests/test_simplex_geometry_v76.py
          tests/test_stock_residue_v76.py
          tests/test_odor_space_v77.py
          tests/test_odor_resolution_v78.py
          tests/test_odor_support_v79.py
          tests/test_supported_release_v80.py
          tests/test_runtime_release_v80.py
          tests/test_confidence_contract_v86.py
          tests/test_release_target_v87.py
          tests/test_backend_alignment_v89.py
          tests/test_transport_fast_path_v89.py
          tests/test_v89_backend_contract.py
          tests/test_v89_language_and_discrimination.py
          tests/test_recipe_delivery_v90.py
          tests/test_backend_contract_v91.py
          tests/test_fixed_assessment.py
      - name: Require actual successful regression evidence
        run: python scripts/verify_junit_floor.py --junit-xml artifacts/regression.xml --minimum-tests 220
      - name: Build clean wheel
        run: python -m build --wheel --outdir artifacts/dist
      - name: Reject unsafe serialized runtime assets
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("artifacts/dist").glob("*.whl"))
          forbidden = (".pt", ".pth", ".pkl", ".pickle", ".joblib")
          with zipfile.ZipFile(wheel) as archive:
              bad = [name for name in archive.namelist() if name.endswith(forbidden)]
          if bad:
              raise SystemExit(f"unsafe runtime assets: {bad}")
          print(wheel)
          PY
      - name: Preserve verified build and regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: verified-wheel-${{ github.run_id }}
          path: |
            artifacts/dist/*.whl
            artifacts/regression.xml
          if-no-files-found: error
          retention-days: 7

  attest-wheel:
    # No attestation publishing or elevated token in pull-request builds.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.publish_attestation
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-wheel-${{ github.run_id }}
          path: artifacts
      - name: Attest the wheel built and verified by this run
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/dist/*.whl
          create-storage-record: false
